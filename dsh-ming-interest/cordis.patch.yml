- insert:
    - id: ming-interest
      name: dsh-ming-interest
      config:
        enabled: true
        workspacePath: '<PUT_YOUR_WORKSPACE>'
        # onebot 的入站录制（recordInbound: true）落在这里。
        inboxPath: '<PUT_YOUR_WORKSPACE>\live\inbox.jsonl'
        chatSessionsPath: '<PUT_YOUR_WORKSPACE>\live\chat-sessions'
        interestsFile: 'live\interests.json'
        logFile: 'live\interest-log.jsonl'
        stateFile: 'live\interest-state.json'
        offFlag: 'live\interest-off'
        pollMs: 20000
        # 上限照谷期那套来，宁可少醒。
        minGapMinutes: 20
        maxPerHour: 3
        quietHours: '01:00-08:00'
        minChars: 6
        contextLines: 4
        # 只认她拉我进的这个群。
        groups:
          - '<PUT_YOUR_GROUP_ID>'
