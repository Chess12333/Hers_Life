- insert:
    - id: ming-interest
      name: dsh-ming-interest
      config:
        # 2026-11-23：默认关。这是作者本机的打开状态，别人装完不该自己开火。
        enabled: false
        workspacePath: '<PUT_YOUR_WORKSPACE>'
        # onebot 的入站录制（recordInbound: true）落在这里。
        # 相对路径按 workspacePath 解（2026-11-23 起），省得把整串路径拼进占位符时替换漏掉一半。
        inboxPath: 'live/inbox.jsonl'
        chatSessionsPath: 'live/chat-sessions'
        interestsFile: 'live\interests.json'
        logFile: 'live\interest-log.jsonl'
        stateFile: 'live\interest-state.json'
        offFlag: 'live\interest-off'
        pollMs: 20000
        # 上限照谷期那套来，宁可少醒。
        minGapMinutes: 20
        maxPerHour: 3
        quietHours: '01:00-08:00'
        minChars: 6
        contextLines: 4
        # 只认她拉我进的这个群。
        groups: []          # 要只认某些群就写号码：- '123456789'
