<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>溟的网页取文 — 设置</title>
<style>
  body { font: 14px/1.6 system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
  label { display: block; margin: 16px 0 4px; font-weight: 600; }
  input { width: 100%; padding: 8px; box-sizing: border-box; font: inherit; }
  .hint { color: #666; font-size: 12px; margin-top: 4px; }
  button { margin-top: 16px; padding: 8px 16px; font: inherit; cursor: pointer; }
  #status { margin-top: 12px; white-space: pre-wrap; }
  .ok { color: #0a7a3d; } .bad { color: #b42318; }
  code { background: #f3f4f6; padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
  <h2>溟的网页取文</h2>
  <p class="hint">接收端在桌宠插件里（DSH 的 webServer），默认地址见下。</p>

  <label for="endpoint">接收端地址</label>
  <input id="endpoint" placeholder="http://127.0.0.1:51557/dsh-ming-mousepet/api/webpick">

  <label for="token">token</label>
  <input id="token" type="password" placeholder="从 webpick-token.json 里复制">
  <div class="hint">
    在这里：<code>%USERPROFILE%\.dsh\ming-mousepet\webpick-token.json</code><br>
    第一次运行桌宠会自动生成。别把它贴到聊天或截图里。
  </div>

  <button id="save">保存</button>
  <button id="test">测一下连接</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
